[project]
name = "PowerControllerViewer"
version = "3.2.0"
description = "View the status of one or more PowerController or LightingControl application instances"
readme = "README.md"
requires-python = ">=3.13"
service_name="PowerControllerViewer"
launch_path="src/main.py"
dependencies = [
    "cerberus>=1.3.7",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "org-enums",
    "pre-commit>=4.3.0",
    "psutil>=7.2.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "sc-foundation-services>=3.5.0",
    "uvicorn[standard]>=0.30.0",
    "wheel>=0.45.1",
]

[tool.pyutil]
managed_scripts = ["launch.sh"]

[tool.uv.sources]
org-enums = { git = "https://github.com/Spello-Consulting/org_enums", rev = "main" }

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-include-markdown-plugin>=6.2.2",
    "mkdocs-material>=9.6.14",
    "mypy>=2.4.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
ignore = [
    "DOC201",  # return type not documented in docstring — too noisy for internal helpers
    "DOC501",  # raised exception not in docstring
    "PLR0914", # too many local variables — view model builders are intentionally wide
    "PLR0915", # too many statements — register_routes is intentionally monolithic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.mypy]
files = ["tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
strict = true

# Existing application modules are not yet fully annotated. Check the test code
# strictly without pulling that separate typing migration into this change.
[[tool.mypy.overrides]]
module = [
    "config_schemas", "housekeeping", "routes", "state_store",
    "websocket_manager", "view_models.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cerberus", "sc_foundation"]
ignore_missing_imports = true
