<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PowerControllerViewer{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var t = localStorage.getItem("theme") || "system";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

{% set _key_qs = ('?key=' ~ page_data.AccessKey) if page_data.AccessKey else '' %}
<header>
  <a class="header-home" href="{{ page_data.home_url }}">PowerController Viewer</a>
  <nav class="header-right">
    <span id="clock"></span>
    <button id="theme-toggle" class="header-link" type="button" title="Toggle light / dark / system theme"></button>
    <a class="header-link" href="/system{{ _key_qs }}">System</a>
    <a class="header-link" href="/config{{ _key_qs }}">Config</a>
  </nav>
</header>

{% block body %}{% endblock %}

<p id="page-footer">Last update: <span id="last-check" data-iso="{{ page_data.LastCheckISO | default('') }}" data-tz="full">{{ page_data.LastCheck }}</span>{% block footer_extra %}{% endblock %}</p>

<script>
  // ── Timezone-aware timestamp rendering ──────────────────────────────────────
  // The server emits "last update" timestamps as ISO 8601 strings carrying the
  // server's UTC offset. We re-render them in the *viewer's* local timezone so the
  // page is unambiguous when viewed from another location. Elements opt in with a
  // data-iso attribute; data-tz controls the suffix ('full' = IANA name like
  // "Europe/Rome", 'abbr' = short name like "CEST"/"GMT+2").
  var CLIENT_TZ = '';
  try { CLIENT_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { CLIENT_TZ = ''; }

  var _DT_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];

  function _dtOrdinal(n) {
    if (n >= 11 && n <= 13) return 'th';
    switch (n % 10) { case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }
  }

  function _dtPad(n) { return String(n).padStart(2, '0'); }

  // ISO string -> "12th June 17:09:21" in the browser's local timezone.
  function formatLocalDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var day = d.getDate();
    return day + _dtOrdinal(day) + ' ' + _DT_MONTHS[d.getMonth()] + ' ' +
           _dtPad(d.getHours()) + ':' + _dtPad(d.getMinutes()) + ':' + _dtPad(d.getSeconds());
  }

  // Short timezone abbreviation for the given instant, e.g. "CEST" or "GMT+2".
  function localTZAbbr(iso) {
    var d = iso ? new Date(iso) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(d);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === 'timeZoneName') return parts[i].value;
      }
    } catch (e) { /* ignore */ }
    return '';
  }

  // Render one element from its data-iso attribute, honoring data-tz.
  function renderLocalDate(el) {
    if (!el) return;
    var iso = el.getAttribute('data-iso');
    if (!iso) return;  // no timestamp — keep the server-rendered fallback text
    var txt = formatLocalDateTime(iso);
    if (!txt) return;
    var mode = el.getAttribute('data-tz');
    if (mode === 'full' && CLIENT_TZ) txt += ' (' + CLIENT_TZ + ')';
    else if (mode === 'abbr') { var a = localTZAbbr(iso); if (a) txt += ' (' + a + ')'; }
    el.textContent = txt;
  }

  // Update an element's timestamp (from a WebSocket push) and re-render it.
  function setLocalDate(el, iso) {
    if (!el) return;
    el.setAttribute('data-iso', iso || '');
    renderLocalDate(el);
  }

  // Initial pass over every timestamp currently on the page.
  function renderAllLocalDates(root) {
    (root || document).querySelectorAll('[data-iso]').forEach(renderLocalDate);
  }
  renderAllLocalDates();

  // ── Live clock ──────────────────────────────────────────────────────────────
  function updateClock() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    var el = document.getElementById('clock');
    if (el) el.textContent = h + ':' + m + ':' + s;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Theme toggle: cycles System → Light → Dark and persists the choice ──────
  (function () {
    var order = ["system", "light", "dark"];
    var icons = { system: "🖥️", light: "☀️", dark: "🌙" };
    var titles = {
      system: "Theme: System (click for Light)",
      light: "Theme: Light (click for Dark)",
      dark: "Theme: Dark (click for System)",
    };
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;

    function current() { return localStorage.getItem("theme") || "system"; }
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      btn.textContent = icons[theme];
      btn.setAttribute("title", titles[theme]);
      btn.setAttribute("aria-label", titles[theme]);
    }
    apply(current());
    btn.addEventListener("click", function () {
      var next = order[(order.indexOf(current()) + 1) % order.length];
      apply(next);
    });
  })();

  // ── Device this page is showing (empty on the home page) ────────────────────
  var PAGE_DEVICE = "{{ (page_data.PageDevice or page_data.DeviceName) | default('') | e }}";

  // ── WebSocket client ────────────────────────────────────────────────────────
  (function () {
    var WS_KEY = "{{ page_data.AccessKey or '' }}";
    var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    if (WS_KEY) wsUrl += '?key=' + encodeURIComponent(WS_KEY);

    var ws;
    var reconnectDelay = 3000;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = function () {
        reconnectDelay = 3000;
      };

      ws.onmessage = function (event) {
        try {
          var msg = JSON.parse(event.data);
          handleWsMessage(msg);
        } catch (e) { /* ignore */ }
      };

      ws.onclose = function () {
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 60000);
      };

      ws.onerror = function () {
        ws.close();
      };
    }

    connect();
  })();

  // ── Periodic hard-refresh (safety net for any missed WS updates) ───────────
  {% if page_data.RefreshDelay %}
  setTimeout(function () { window.location.reload(); }, {{ page_data.RefreshDelay * 1000 }});
  {% endif %}

  // ── WS handler — child templates override this block ────────────────────────
  function handleWsMessage(msg) {
    // If the device we're viewing was deleted, go home
    if (msg.type === 'device_deleted' && PAGE_DEVICE && msg.device_name === PAGE_DEVICE) {
      window.location.href = '{{ page_data.home_url }}';
      return;
    }
    {% block ws_handler %}{% endblock %}
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
