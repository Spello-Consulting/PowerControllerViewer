# PowerControllerViewer development configuration file

Website:
  HostingIP: 0.0.0.0
  Port: 8000
  PageAutoRefresh: 10
  DebugMode: True

Files:
  LogfileName: logs/logfile.log
  # Include the process ID in the log entries
  LogProcessID: True
  LogfileMaxLines: 5000
  # How much information do we write to the log file. One of: none; error; warning; summary; detailed; debug; all
  LogfileVerbosity: debug
  # How much information do we write to the console. One of: error; warning; summary; detailed; debug; all
  ConsoleVerbosity: debug
  DeleteOldStateFiles: 0  # Delete state files older than this many hours. Set to 0 or blank to disable deletion.
