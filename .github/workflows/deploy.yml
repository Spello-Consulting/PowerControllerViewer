name: Deploy PowerControllerViewer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp
          - pi-spello
          - both

jobs:
  deploy-sydneyapp:
    name: Deploy → sydneyapp
    if: ${{ inputs.environment == 'sydneyapp' || inputs.environment == 'both' }}
    runs-on: [self-hosted, sydneyapp]
    environment: sydneyapp        # triggers approval gate if configured in GitHub
    steps:
      - name: Stop the service
        run: |
          sudo --chdir=/home/nick/scripts/PowerControllerViewer /home/nick/scripts/pyutil/servicectrl.sh stop

      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/nick/scripts/PowerControllerViewer /home/nick/scripts/pyutil/gitrefresh.sh --yes

      - name: Deploy and start the service
        run: sudo --chdir=/home/nick/scripts/PowerControllerViewer /home/nick/scripts/pyutil/servicectrl.sh deploy sydneyapp

      - name: Verify service is running
        run: |
          sleep 6
          sudo --chdir=/home/nick/scripts/PowerControllerViewer /home/nick/scripts/pyutil/servicectrl.sh is-active

